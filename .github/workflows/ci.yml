name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Group per PR number, or per commit SHA on main. cancel-in-progress only for
# pull_request, so a newer push cancels an older run of the same PR and every
# main push gets its own CI run (which drives the staging deploy via workflow_run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secrets here: this runs on pull requests.
permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    # The required status check on main (branch ruleset).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run deps:check
      - run: npm run licenses:check
      - run: npm run build
      - run: npm run build:cf
        env:
          # Exercises the #51 W-1 guard: precache must strip this from /_shell.
          PUBLIC_HOSTNAME: bica.appelgriebsch.org
      # The built-output tests against the Worker bundle just built.
      - run: BICA_BUILT=1 DEPLOY_TARGET=cloudflare npm test
      # Bundling, bindings and assets; needs no Cloudflare token.
      - run: npx wrangler deploy --dry-run --env staging --config wrangler.toml
      - run: npx wrangler deploy --dry-run --env production --config wrangler.toml
