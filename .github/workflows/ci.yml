name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Group per PR number, or per commit SHA on main. cancel-in-progress only for
# pull_request, so a newer push cancels an older run of the same PR and every
# main push gets its own CI run (which drives the staging deploy via workflow_run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secrets here: this runs on pull requests.
permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    # The required status check on main (branch ruleset).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/node-check.mjs --exact
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit --prod --audit-level=high
      - name: Full audit (report only, #65 optional-peer findings)
        continue-on-error: true
        run: bun audit
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run deps:check
      - run: bun run licenses:check
      - run: bun run build
      - run: bun run build:cf
        env:
          # Exercises the #51 W-1 guard: precache must strip this from /_shell.
          PUBLIC_HOSTNAME: bica.appelgriebsch.org
      # The built-output tests against the Worker bundle just built.
      - run: BICA_BUILT=1 DEPLOY_TARGET=cloudflare bun run test
      # Bundling, bindings and assets; needs no Cloudflare token.
      - run: bunx wrangler deploy --dry-run --env staging --config wrangler.toml
      - run: bunx wrangler deploy --dry-run --env production --config wrangler.toml
