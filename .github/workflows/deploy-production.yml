name: Deploy production

# #8: production deploys only by hand, from main, for a sha with green CI, and
# only after a required reviewer approves the `production` environment. Never
# on push, never from workflow_run.
on:
  workflow_dispatch:

# One fixed group, never cancelled: two prod runs never overlap or cancel.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Nothing at workflow level; each job gets exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # No environment and no secrets: runs before the approval gate.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read # reads the CI check run
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      # Newest CI check run (highest id) for this sha must have completed with
      # success; a pending re-run blocks it. Same jq as deploy-staging.yml.
      - name: Require green CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned: the dispatched commit, nothing caller-supplied.
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=CI" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
          echo "CI for $SHA: $conclusion"
          test "$conclusion" = success
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment: approval before any Cloudflare call.
    environment:
      name: production
      url: https://bica.appelgriebsch.org
    steps:
      # Exactly the sha the gate checked.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release build. Tests ran in CI for this sha.
      - run: npm run build:cf
        env:
          VITE_PUBLIC_HOSTNAME: bica.appelgriebsch.org
      - name: Deploy bica-production
        run: npx wrangler deploy --env production --config wrangler.toml | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The custom domain can lag a few seconds behind `wrangler deploy`.
      - name: Smoke /api/health and /
        timeout-minutes: 3
        run: |
          url=https://bica.appelgriebsch.org
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 "$url/api/health") \
              && [ "$(jq -r .stage <<<"$body")" = production ] && break
            body=""
            sleep 5
          done
          [ -n "$body" ] || { echo "::error::/api/health never answered stage=production at $url"; exit 1; }
          echo "$body"
          test "$(jq -r .ok <<<"$body")" = true
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url/")
          [ "$code" = 200 ] || { echo "::error::GET / returned $code"; exit 1; }
          echo "GET / 200"
