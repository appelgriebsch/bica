name: Deploy staging

on:
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deps:check
      - run: npm run build:cf
      # Separate from the build: build:cf never touches a database. Skips with a
      # message when the environment has no DATABASE_URL secret.
      - name: Migrate staging database
        run: npm run db:migrate:staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy bica-staging
        run: npx wrangler deploy --env staging --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
