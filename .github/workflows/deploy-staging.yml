name: Deploy staging

# Deploys only a commit whose CI run on main succeeded for a push (#23).
# workflow_run keeps the deploy secrets and the staging environment out of the
# workflow that runs on pull requests, and a failed deploy never turns the
# required CI check red. It always uses this file from the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One fixed group, never cancelled: pushes queue up instead of interrupting a
# running migration or deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # the manual-run guard reads the CI check run

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main only, on every path: a manual run from main, or green CI for a push to
    # main of this repository (not a fork).
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    steps:
      # A manual run deploys only a sha whose newest CI check run (highest id: a
      # queued one has no start time yet) has
      # completed with success; a pending re-run blocks it.
      # ponytail: matches the check (job) name "CI", not the workflow path; a
      # renamed job or a second check named CI would need this updated.
      - name: Require green CI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=CI" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
          echo "CI for $SHA: $conclusion"
          test "$conclusion" = success
      # Exactly the commit CI tested (workflow_run defaults to the branch head).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release build. Tests, lint and deps:check ran in CI for this sha.
      # TURNSTILE_SITE_KEY (#35) is public and baked into the client; it's a
      # GitHub `staging` environment variable, not a secret. Unset, the build
      # uses Cloudflare's test key and the real secret rejects every token.
      - run: |
          [ -n "$TURNSTILE_SITE_KEY" ] || echo "::warning::vars.TURNSTILE_SITE_KEY is unset: Conversas will refuse every turn (403)"
          npm run build:cf
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Deploy bica-staging
        run: npx wrangler deploy --env staging --config wrangler.toml | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke /api/health
        run: |
          url=$(grep -oE 'https://bica-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)
          test -n "$url" || { echo "no workers.dev URL in the deploy output"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$url/api/health") && break
            sleep 5
          done
          [ -n "${body:-}" ] || { echo "::error::/api/health never answered at $url"; exit 1; }
          echo "$body"
          test "$(jq -r .stage <<<"$body")" = staging
      # #28: HTML carries the security headers and a (Report-Only) nonce CSP.
      # workers.dev keeps serving the previous version for a few seconds after
      # `wrangler deploy` returns (run 38550854181 probed 0.4 s later and got the
      # pre-#28 Worker, which has none of these headers). /api/health can't tell
      # versions apart, so retry the whole check for up to ~60 s; a version that
      # really lacks a header still fails after the last attempt.
      - name: Smoke security headers
        timeout-minutes: 3
        run: |
          url=$(grep -oE 'https://bica-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1 || true)
          [ -n "$url" ] || { echo "::error::No bica-staging workers.dev URL in deploy.log"; exit 1; }
          check() {
            for path in / /me; do
              for method in HEAD GET; do
                if [ "$method" = HEAD ]; then
                  headers=$(curl -fsSI --max-time 10 "$url$path") || { echo "$method $path: request failed"; return 1; }
                else
                  headers=$(curl -fsS -D- -o /dev/null --max-time 10 "$url$path") || { echo "$method $path: request failed"; return 1; }
                fi
                for h in strict-transport-security x-frame-options referrer-policy x-content-type-options permissions-policy cross-origin-opener-policy; do
                  grep -qi "^$h:" <<<"$headers" || { echo "$method $path: missing $h"; return 1; }
                done
                # Report-Only until CSP_ENFORCE is set; either header must carry a nonce.
                grep -qiE "^content-security-policy(-report-only)?:.*'nonce-" <<<"$headers" || { echo "$method $path: no nonce CSP"; return 1; }
                # #35: Turnstile's frame is allowed.
                grep -qiE "^content-security-policy(-report-only)?:.*frame-src https://challenges\.cloudflare\.com" <<<"$headers" || { echo "$method $path: CSP lacks Turnstile frame-src"; return 1; }
              done
            done
          }
          for i in $(seq 1 12); do
            if out=$(check); then echo "security headers ok (attempt $i)"; exit 0; fi
            echo "attempt $i: $out"
            [ "$i" -lt 12 ] && sleep 5
          done
          echo "::error::$out"
          exit 1
