name: Deploy staging

# Deploys only a commit whose CI run on main succeeded for a push (#23).
# workflow_run keeps the deploy secrets and the staging environment out of the
# workflow that runs on pull requests, and a failed deploy never turns the
# required CI check red. It always uses this file from the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One fixed group, never cancelled: pushes queue up instead of interrupting a
# running migration or deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # the manual-run guard reads the CI check run

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main only, on every path: a manual run from main, or green CI for a push to
    # main of this repository (not a fork).
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    steps:
      # A manual run deploys only a sha whose newest CI check run (by start time) has
      # completed with success; a pending re-run blocks it.
      # ponytail: matches the check (job) name "CI", not the workflow path; a
      # renamed job or a second check named CI would need this updated.
      - name: Require green CI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=CI" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
          echo "CI for $SHA: $conclusion"
          test "$conclusion" = success
      # Exactly the commit CI tested (workflow_run defaults to the branch head).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release build. Tests, lint and deps:check ran in CI for this sha.
      - run: npm run build:cf
      # Finds or creates bica-staging and writes its id into wrangler.ci.toml
      # (gitignored). Fails fast when a Cloudflare secret is empty.
      - name: Provision staging D1
        id: d1
        run: node scripts/ci-d1-provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Applies pending migrations/*.sql (tracked in d1_migrations) before deploy.
      - name: Migrate staging D1
        run: npx wrangler d1 migrations apply DB --env staging --remote --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy bica-staging
        run: npx wrangler deploy --env staging --config wrangler.ci.toml | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke /api/health
        run: |
          url=$(grep -oE 'https://bica-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)
          test -n "$url" || { echo "no workers.dev URL in the deploy output"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$url/api/health") && break
            sleep 5
          done
          echo "$body"
          test "$(jq -r .stage <<<"$body")" = staging
