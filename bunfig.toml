# No dependency lifecycle scripts run (#56 W-1). In Bun 1.4.2 an empty
# package.json "trustedDependencies" still falls back to Bun's default-trusted
# list (workerd's postinstall ran), so this is what enforces it.
# `bun run` pre/post scripts (pretest) are unaffected.
[install]
ignoreScripts = true
