<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <!-- Bica app mark (#104 re-opened, ADR 0010). Foundation: the `azulejo-logo`
       from the Bica library (Mistral document library), vendored verbatim as
       scripts/icon-regen/azulejo-logo.svg. Here its geometry is kept verbatim
       inside scale(0.64) (the regen pipeline's 64-unit grid) and recolored to
       the Bica palette: cream #F6F1E8 tile, cobalt #1E4D73 ink. The original's
       self-referential <use href="#petals" rotate(45)> is expanded into explicit
       rotate() copies so the rosette renders as eight petals in every renderer.
       Original owned artwork, hand-adapted - not AI-generated. -->
  <g transform="scale(0.64)">
    <rect x="0" y="0" width="100" height="100" rx="14" fill="#F6F1E8"/>
    <rect x="6" y="6" width="88" height="88" rx="10" fill="none" stroke="#1E4D73" stroke-width="2"/>
    <g fill="#1E4D73">
      <path d="M10 10 q0 16 16 -0 q0 16 -16 16 q-16 0 0 -16 Z"/>
      <circle cx="18" cy="18" r="3.4" fill="#F6F1E8"/>
      <path d="M90 10 q0 16 -16 0 q0 16 16 16 q16 0 0 -16 Z"/>
      <circle cx="82" cy="18" r="3.4" fill="#F6F1E8"/>
      <path d="M10 90 q0 -16 16 0 q0 -16 -16 -16 q-16 0 0 16 Z"/>
      <circle cx="18" cy="82" r="3.4" fill="#F6F1E8"/>
      <path d="M90 90 q0 -16 -16 0 q0 -16 16 -16 q16 0 0 16 Z"/>
      <circle cx="82" cy="82" r="3.4" fill="#F6F1E8"/>
    </g>
    <g fill="#1E4D73">
      <path id="pt" d="M50 50 C 43 38, 43 28, 50 20 C 57 28, 57 38, 50 50 Z"/>
      <use href="#pt" transform="rotate(90 50 50)"/>
      <use href="#pt" transform="rotate(180 50 50)"/>
      <use href="#pt" transform="rotate(270 50 50)"/>
      <use href="#pt" transform="rotate(45 50 50)"/>
      <use href="#pt" transform="rotate(135 50 50)"/>
      <use href="#pt" transform="rotate(225 50 50)"/>
      <use href="#pt" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="7.5" fill="#F6F1E8"/>
    <circle cx="50" cy="50" r="5" fill="#1E4D73"/>
    <circle cx="50" cy="50" r="2" fill="#F6F1E8"/>
    <g fill="#1E4D73">
      <path d="M50 8 l3 4 -3 4 -3 -4 Z"/>
      <path d="M50 84 l3 4 -3 4 -3 -4 Z"/>
      <path d="M8 50 l4 -3 4 3 -4 3 Z"/>
      <path d="M84 50 l4 -3 4 3 -4 3 Z"/>
    </g>
  </g>
</svg>
