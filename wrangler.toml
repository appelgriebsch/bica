# Staging Worker only. Top-level publish has no workers.dev route and no
# BICA_STAGE, so /api/health fails closed. Do not add a production
# environment, routes, or a custom domain in this file.
name = "bica"
main = ".output/server/staging-entry.mjs"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Nitro already bundled the server. Wrangler must not bundle it again.
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"
# Serve files at their exact path: no .html stripping or trailing-slash
# redirects (a cached redirect for /_shell would break offline navigations).
html_handling = "none"
# Unknown paths fall through to the Worker, which renders the app routes.
not_found_handling = "none"

# No D1 since #33: progress is device-only (ADR 0002 addendum). #36 brings a
# database back only if it's built.

[observability]
enabled = true

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]

[env.staging]
workers_dev = true

[env.staging.vars]
BICA_STAGE = "staging"

# Chat burst limit (#13), across isolates. Cloudflare allows only period = 10
# or 60; the 10-min and daily caps are in memory (chat-limit.ts) until #35.
# limit must match DEFAULT_LIMITS.perMinute. Production gets its own via #8.
[[env.staging.ratelimits]]
name = "CHAT_RATE"
namespace_id = "1301"
simple = { limit = 6, period = 60 }
