# Staging and production Workers (#8). The top level stays inert: no
# workers.dev route, no route and no BICA_STAGE, so a publish without --env
# fails closed at /api/health. Deploys only through
# .github/workflows/deploy.yml (build once, then approval-gated production).
name = "bica"
main = ".output/server/staging-entry.mjs"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Nitro already bundled the server. Wrangler must not bundle it again.
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"
# Serve files at their exact path: no .html stripping or trailing-slash
# redirects (a cached redirect for /_shell would break offline navigations).
html_handling = "none"
# Unknown paths fall through to the Worker, which renders the app routes.
not_found_handling = "none"

# No D1 since #33: progress is device-only (ADR 0002 addendum). #36 brings a
# database back only if it's built.

[observability]
enabled = true

# #35: the daily chat budget (global + per-IP counters) lives in one Durable
# Object. The class is exported by the generated entry (write-cf-entry.mjs).
# Migrations are top-level and apply to every environment; never edit or
# reorder an applied tag, only append.
[[migrations]]
tag = "v1-chat-budget"
new_sqlite_classes = ["ChatBudget"]

# Bound at top level too so local `wrangler dev` (the BICA_BUILT tests) runs
# the real Durable Object; bindings aren't inherited, staging repeats it.
[[durable_objects.bindings]]
name = "CHAT_BUDGET"
class_name = "ChatBudget"

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]

[env.staging]
workers_dev = true

[env.staging.vars]
BICA_STAGE = "staging"
# #35: the only frontend hostname siteverify may report for staging. Never
# localhost. The public site key is a build-time constant
# (src/lib/turnstile-keys.mjs); TURNSTILE_SECRET_KEY is a Worker secret.
TURNSTILE_HOSTNAMES = "bica-staging.appelgriebsch.workers.dev"
# #51: og:image and the manifest id. Read at runtime, not baked into the build.
PUBLIC_HOSTNAME = "bica-staging.appelgriebsch.workers.dev"
# #55: enforce CSP here. Production stays Report-Only until a few clean days.
CSP_ENFORCE = "1"

# Chat burst limit (#13, keyed by client IP since #35), across isolates.
# Cloudflare allows only period = 10 or 60. limit must match
# DEFAULT_LIMITS.perMinute. Production has its own block below.
[[env.staging.ratelimits]]
name = "CHAT_RATE"
namespace_id = "1301"
simple = { limit = 6, period = 60 }

# Daily chat budget (#35). Production repeats this block.
[[env.staging.durable_objects.bindings]]
name = "CHAT_BUDGET"
class_name = "ChatBudget"

# Production (#8): custom domain only, no workers.dev, no D1, no auth.
[env.production]
workers_dev = false
routes = [{ pattern = "bica.appelgriebsch.org", custom_domain = true }]

[env.production.vars]
BICA_STAGE = "production"
# Only the prod hostname, never localhost. Add it to the Turnstile widget too.
TURNSTILE_HOSTNAMES = "bica.appelgriebsch.org"
PUBLIC_HOSTNAME = "bica.appelgriebsch.org"

# Its own namespace, so prod and staging bursts never share a counter.
# limit must match DEFAULT_LIMITS.perMinute.
[[env.production.ratelimits]]
name = "CHAT_RATE"
namespace_id = "1302"
simple = { limit = 6, period = 60 }

[[env.production.durable_objects.bindings]]
name = "CHAT_BUDGET"
class_name = "ChatBudget"
